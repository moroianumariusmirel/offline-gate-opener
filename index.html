<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Gate Opener</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, hsl(220, 25%, 10%), hsl(220, 30%, 6%));
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: hsl(0, 0%, 95%);
      --text-muted: hsl(220, 10%, 65%);
      --accent-blue: hsl(210, 100%, 55%);
      --accent-blue-glow: hsla(210, 100%, 55%, 0.3);
      --accent-green: hsl(145, 80%, 45%);
      --accent-green-glow: hsla(145, 80%, 45%, 0.25);
      --accent-red: hsl(355, 80%, 55%);
      --accent-red-glow: hsla(355, 80%, 55%, 0.25);
      --accent-orange: hsl(35, 90%, 50%);
      --font-display: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 24px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: relative;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 8px;
    }

    .header h1 {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(120deg, #fff, hsl(210, 100%, 75%));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* Status indicator */
    .status-panel {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .status-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .status-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    .status-text {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-red);
      box-shadow: 0 0 10px var(--accent-red-glow);
      transition: all 0.3s ease;
    }

    .status-dot.connected {
      background: var(--accent-green);
      box-shadow: 0 0 12px var(--accent-green-glow);
    }

    .status-dot.connecting {
      background: var(--accent-orange);
      box-shadow: 0 0 12px hsla(35, 90%, 50%, 0.4);
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* Configuration Panel */
    .config-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 20px;
      padding: 16px;
    }

    .config-title {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .input-field {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-field:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px var(--accent-blue-glow);
    }

    /* Connection Button */
    .btn-connect {
      background: var(--accent-blue);
      color: #fff;
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 24px var(--accent-blue-glow);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-connect:active {
      transform: scale(0.97);
      box-shadow: 0 4px 12px var(--accent-blue-glow);
    }

    .btn-connect:disabled {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Control Panel */
    .control-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .btn-control {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px 12px;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-control:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      pointer-events: none;
    }

    .btn-control:not(:disabled):hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .btn-control:not(:disabled):active {
      transform: translateY(1px) scale(0.97);
    }

    .btn-control svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.2s ease;
    }

    .btn-control span {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    /* Target specific custom highlights */
    .btn-open {
      color: var(--accent-green);
    }
    .btn-open:not(:disabled):active {
      box-shadow: 0 0 16px var(--accent-green-glow);
    }

    .btn-close {
      color: var(--accent-blue);
    }
    .btn-close:not(:disabled):active {
      box-shadow: 0 0 16px var(--accent-blue-glow);
    }

    .btn-stop {
      color: var(--accent-red);
      grid-column: span 2;
      padding: 16px;
      flex-direction: row;
      gap: 12px;
      border-radius: 16px;
    }
    .btn-stop:not(:disabled):active {
      box-shadow: 0 0 16px var(--accent-red-glow);
    }

    /* Logs view */
    .log-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }
    
    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 0 4px;
    }

    .btn-copy-logs {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 9px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      -webkit-user-select: none;
    }

    .btn-copy-logs:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-copy-logs:active {
      transform: scale(0.95);
    }

    .log-panel, .log-panel * {
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    .log-panel {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 14px;
      max-height: 100px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 11px;
      color: hsl(220, 10%, 55%);
      display: flex;
      flex-direction: column;
      gap: 4px;
      scroll-behavior: smooth;
    }

    .log-entry.error {
      color: var(--accent-red);
    }

    .log-entry.success {
      color: var(--accent-green);
    }

    .log-entry.info {
      color: var(--accent-blue);
    }

    /* Custom Scrollbar */
    .log-panel::-webkit-scrollbar {
      width: 4px;
    }
    .log-panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    /* PWA Offline Badge */
    .offline-badge {
      position: absolute;
      top: -12px;
      right: 24px;
      background: hsl(145, 80%, 25%);
      color: hsl(145, 85%, 85%);
      border: 1px solid hsl(145, 80%, 35%);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="offline-badge">100% OFFLINE</div>

    <!-- Header -->
    <div class="header">
      <h1>Gate Controller</h1>
      <p>Offline Bluetooth Smart Gate Opener</p>
    </div>

    <!-- Status panel -->
    <div class="status-panel">
      <div class="status-info">
        <div class="status-title">Bluetooth Connection</div>
        <div id="status-text" class="status-text">
          <div id="status-dot" class="status-dot"></div>
          Disconnected
        </div>
      </div>
      <!-- Connect button -->
      <button id="btn-connect" class="btn-connect">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
          <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
        <span>Connect</span>
      </button>
    </div>

    <!-- Configuration Panel -->
    <div class="config-panel">
      <div class="config-title">Device Credentials</div>
      
      <div class="input-group">
        <label for="device-passcode">Device Passcode / Token Prefix</label>
        <input type="password" id="device-passcode" class="input-field" placeholder="Enter WBT Device Key Token">
      </div>

      <div class="input-group">
        <label for="device-pin">Gate Security PIN</label>
        <input type="text" id="device-pin" class="input-field" placeholder="Enter your 4-digit PIN">
      </div>

      <div class="input-group">
        <label for="device-serial">Device Serial Suffix</label>
        <input type="text" id="device-serial" class="input-field" placeholder="9999999" value="9999999">
      </div>
    </div>

    <!-- Control Grid -->
    <div class="control-grid">
      <!-- Full Open -->
      <button id="btn-open" class="btn-control btn-open" disabled>
        <svg viewBox="0 0 24 24">
          <path d="M3 3h18v18H3z" stroke="currentColor" stroke-dasharray="4 4" />
          <path d="M9 3v18M15 3v18" stroke="currentColor" />
          <path d="M3 12h6m6 0h6" stroke="currentColor" />
          <polyline points="5 10 3 12 5 14" stroke="currentColor" />
          <polyline points="19 10 21 12 19 14" stroke="currentColor" />
        </svg>
        <span>FULL OPEN</span>
      </button>

      <!-- Full Close -->
      <button id="btn-close" class="btn-control btn-close" disabled>
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" />
          <path d="M9 3v18M15 3v18" stroke="currentColor" />
          <path d="M3 12h18" stroke="currentColor" />
        </svg>
        <span>FULL CLOSE</span>
      </button>

      <!-- Pedestrian -->
      <button id="btn-ped" class="btn-control" disabled>
        <svg viewBox="0 0 24 24">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" stroke="currentColor" />
          <circle cx="9" cy="7" r="4" stroke="currentColor" />
          <path d="M23 21v-2a4 4 0 0 0-3-3.87" stroke="currentColor" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" stroke="currentColor" />
        </svg>
        <span>PED OPEN</span>
      </button>

      <!-- Light Toggle -->
      <button id="btn-light" class="btn-control" disabled>
        <svg viewBox="0 0 24 24">
          <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .5 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" stroke="currentColor" />
          <line x1="9" y1="18" x2="15" y2="18" stroke="currentColor" />
          <line x1="10" y1="22" x2="14" y2="22" stroke="currentColor" />
        </svg>
        <span>LIGHT TOGGLE</span>
      </button>

      <!-- Emergency Stop -->
      <button id="btn-stop" class="btn-control btn-stop" disabled>
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" stroke="currentColor" />
          <rect x="9" y="9" width="6" height="6" fill="currentColor" stroke="currentColor" />
        </svg>
        <span>EMERGENCY STOP</span>
      </button>
    </div>

    <!-- Logs panel -->
    <div class="log-container">
      <div class="log-header">
        <span>Connection Log</span>
        <button id="btn-copy-logs" class="btn-copy-logs" title="Copy logs to clipboard">
          <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span>Copy</span>
        </button>
      </div>
      <div id="log-panel" class="log-panel">
        <div class="log-entry">App initialized. Fill credentials and tap Connect.</div>
      </div>
    </div>
  </div>

  <script>
    // Pure JavaScript MD5 Implementation (outputs Hex string)
    function md5(string) {
      function RotateLeft(lValue, iShiftBits) {
        return (lValue<<iShiftBits) | (lValue>>>(32-iShiftBits));
      }
      function AddUnsigned(lX,lY) {
        var lX4,lY4,lX8,lY8,lResult;
        lX8 = (lX & 0x80000000);
        lY8 = (lY & 0x80000000);
        lX4 = (lX & 0x40000000);
        lY4 = (lY & 0x40000000);
        lResult = (lX & 0x3FFFFFFF)+(lY & 0x3FFFFFFF);
        if (lX4 & lY4) {
          return (lResult ^ 0x80000000 ^ lX8 ^ lY8);
        }
        if (lX4 | lY4) {
          if (lResult & 0x40000000) {
            return (lResult ^ 0xC0000000 ^ lX8 ^ lY8);
          } else {
            return (lResult ^ 0x40000000 ^ lX8 ^ lY8);
          }
        } else {
          return (lResult ^ lX8 ^ lY8);
        }
      }
      function F(x,y,z) { return (x & y) | ((~x) & z); }
      function G(x,y,z) { return (x & z) | (y & (~z)); }
      function H(x,y,z) { return (x ^ y ^ z); }
      function I(x,y,z) { return (y ^ (x | (~z))); }
      function FF(a,b,c,d,x,s,ac) {
        a = AddUnsigned(a, AddUnsigned(AddUnsigned(F(b,c,d), x), ac));
        return AddUnsigned(RotateLeft(a, s), b);
      }
      function GG(a,b,c,d,x,s,ac) {
        a = AddUnsigned(a, AddUnsigned(AddUnsigned(G(b,c,d), x), ac));
        return AddUnsigned(RotateLeft(a, s), b);
      }
      function HH(a,b,c,d,x,s,ac) {
        a = AddUnsigned(a, AddUnsigned(AddUnsigned(H(b,c,d), x), ac));
        return AddUnsigned(RotateLeft(a, s), b);
      }
      function II(a,b,c,d,x,s,ac) {
        a = AddUnsigned(a, AddUnsigned(AddUnsigned(I(b,c,d), x), ac));
        return AddUnsigned(RotateLeft(a, s), b);
      }
      function ConvertToWordArray(string) {
        var lWordCount;
        var lMessageLength = string.length;
        var lNumberOfWords_temp1=lMessageLength + 8;
        var lNumberOfWords_temp2=(lNumberOfWords_temp1 - (lNumberOfWords_temp1 % 64))/64;
        var lNumberOfWords = (lNumberOfWords_temp2 + 1)*16;
        var lWordArray=Array(lNumberOfWords-1);
        var lBytePosition = 0;
        var lByteCount = 0;
        while ( lByteCount < lMessageLength ) {
          lWordCount = (lByteCount - (lByteCount % 4))/4;
          lBytePosition = (lByteCount % 4)*8;
          lWordArray[lWordCount] = (lWordArray[lWordCount] | (string.charCodeAt(lByteCount)<<lBytePosition));
          lByteCount++;
        }
        lWordCount = (lByteCount - (lByteCount % 4))/4;
        lBytePosition = (lByteCount % 4)*8;
        lWordArray[lWordCount] = lWordArray[lWordCount] | (0x80<<lBytePosition);
        lWordArray[lNumberOfWords-2] = lMessageLength<<3;
        lWordArray[lNumberOfWords-1] = lMessageLength>>>29;
        return lWordArray;
      }
      function WordToHex(lValue) {
        var WordToHexValue="",WordToHexValue_temp="",lByte,lCount;
        for (lCount = 0;lCount<=3;lCount++) {
          lByte = (lValue>>>(lCount*8)) & 255;
          WordToHexValue_temp = "0" + lByte.toString(16);
          WordToHexValue = WordToHexValue + WordToHexValue_temp.substr(WordToHexValue_temp.length-2,2);
        }
        return WordToHexValue;
      }
      function Utf8Encode(string) {
        string = string.replace(/\r\n/g,"\n");
        var utftext = "";
        for (var n = 0; n < string.length; n++) {
          var c = string.charCodeAt(n);
          if (c < 128) {
            utftext += String.fromCharCode(c);
          } else if((c > 127) && (c < 2048)) {
            utftext += String.fromCharCode((c >> 6) | 192);
            utftext += String.fromCharCode((c & 63) | 128);
          } else {
            utftext += String.fromCharCode((c >> 12) | 224);
            utftext += String.fromCharCode(((c >> 6) & 63) | 128);
            utftext += String.fromCharCode((c & 63) | 128);
          }
        }
        return utftext;
      }
      var x=Array();
      var k,AA,BB,CC,DD,a,b,c,d;
      var S11=7, S12=12, S13=17, S14=22;
      var S21=5, S22=9 , S23=14, S24=20;
      var S31=4, S32=11, S33=16, S34=23;
      var S41=6, S42=10, S43=15, S44=21;
      string = Utf8Encode(string);
      x = ConvertToWordArray(string);
      a = 0x67452301; b = 0xEFCDAB89; c = 0x98BADCFE; d = 0x10325476;
      for (k=0;k<x.length;k+=16) {
        AA=a; BB=b; CC=c; DD=d;
        a=FF(a,b,c,d,x[k+0], S11,0xD76AA478);
        d=FF(d,a,b,c,x[k+1], S12,0xE8C7B756);
        c=FF(c,d,a,b,x[k+2], S13,0x242070DB);
        b=FF(b,c,d,a,x[k+3], S14,0xC1BDCEEE);
        a=FF(a,b,c,d,x[k+4], S11,0xF57C0FAF);
        d=FF(d,a,b,c,x[k+5], S12,0x4787C62A);
        c=FF(c,d,a,b,x[k+6], S13,0xA8304613);
        b=FF(b,c,d,a,x[k+7], S14,0xFD469501);
        a=FF(a,b,c,d,x[k+8], S11,0x698098D8);
        d=FF(d,a,b,c,x[k+9], S12,0x8B44F7AF);
        c=FF(c,d,a,b,x[k+10],S13,0xFFFF5BB1);
        b=FF(b,c,d,a,x[k+11],S14,0x895CD7BE);
        a=FF(a,b,c,d,x[k+12],S11,0x6B901122);
        d=FF(d,a,b,c,x[k+13],S12,0xFD987193);
        c=FF(c,d,a,b,x[k+14],S13,0xA679438E);
        b=FF(b,c,d,a,x[k+15],S14,0x49B40821);
        a=GG(a,b,c,d,x[k+1], S21,0xF61E2562);
        d=GG(d,a,b,c,x[k+6], S22,0xC040B340);
        c=GG(c,d,a,b,x[k+11],S23,0x265E5A51);
        b=GG(b,c,d,a,x[k+0], S24,0xE9B6C7AA);
        a=GG(a,b,c,d,x[k+5], S21,0xD62F105D);
        d=GG(d,a,b,c,x[k+10],S22,0x2441453);
        c=GG(c,d,a,b,x[k+15],S23,0xD8A1E681);
        b=GG(b,c,d,a,x[k+4], S24,0xE7D3FBC8);
        a=GG(a,b,c,d,x[k+9], S21,0x21E1CDE6);
        d=GG(d,a,b,c,x[k+14],S22,0xC33707D6);
        c=GG(c,d,a,b,x[k+3], S23,0xF4D50D87);
        b=GG(b,c,d,a,x[k+8], S24,0x455A14ED);
        a=GG(a,b,c,d,x[k+13],S21,0xA9E3E905);
        d=GG(d,a,b,c,x[k+2], S22,0xFCEFA3F8);
        c=GG(c,d,a,b,x[k+7], S23,0x676F02D9);
        b=GG(b,c,d,a,x[k+12],S24,0x8D2A4C8A);
        a=HH(a,b,c,d,x[k+5], S31,0xFFFA3942);
        d=HH(d,a,b,c,x[k+8], S32,0x8771F681);
        c=HH(c,d,a,b,x[k+11],S33,0x6D9D6122);
        b=HH(b,c,d,a,x[k+14],S34,0xFDE5380C);
        a=HH(a,b,c,d,x[k+1], S31,0xA4BEEA44);
        d=HH(d,a,b,c,x[k+4], S32,0x4BDECFA9);
        c=HH(c,d,a,b,x[k+7], S33,0xF6BB4B60);
        b=HH(b,c,d,a,x[k+10],S34,0xBEBFBC70);
        a=HH(a,b,c,d,x[k+13],S31,0x289B7EC6);
        d=HH(d,a,b,c,x[k+0], S32,0xEAA127FA);
        c=HH(c,d,a,b,x[k+3], S33,0xd4ef3085);
        b=HH(b,c,d,a,x[k+6], S34,0x4881D05);
        a=HH(a,b,c,d,x[k+9], S31,0xD9D4D039);
        d=HH(d,a,b,c,x[k+12],S32,0xE6DB99E5);
        c=HH(c,d,a,b,x[k+15],S33,0x1FA27CF8);
        b=HH(b,c,d,a,x[k+2], S34,0xC4AC5665);
        a=II(a,b,c,d,x[k+0], S41,0xF4292244);
        d=II(d,a,b,c,x[k+7], S42,0x432AFF97);
        c=II(c,d,a,b,x[k+14],S43,0xAB9423A7);
        b=II(b,c,d,a,x[k+5], S44,0xFC93A039);
        a=II(a,b,c,d,x[k+12],S41,0x655B59C3);
        d=II(d,a,b,c,x[k+3], S42,0x8F0CCC92);
        c=II(c,d,a,b,x[k+10],S43,0xFFEFF47D);
        b=II(b,c,d,a,x[k+1], S44,0x85845DD1);
        a=II(a,b,c,d,x[k+8], S41,0x6FA87E4F);
        d=II(d,a,b,c,x[k+15],S42,0xFE2CE6E0);
        c=II(c,d,a,b,x[k+6], S43,0xA3014314);
        b=II(b,c,d,a,x[k+13],S44,0x4E0811A1);
        a=II(a,b,c,d,x[k+4], S41,0xF7537E82);
        d=II(d,a,b,c,x[k+11],S42,0xBD3AF235);
        c=II(c,d,a,b,x[k+2], S43,0x2AD7D2BB);
        b=II(b,c,d,a,x[k+9], S44,0xEB86D391);
        a=AddUnsigned(a,AA); b=AddUnsigned(b,BB); c=AddUnsigned(c,CC); d=AddUnsigned(d,DD);
      }
      var temp = WordToHex(a)+WordToHex(b)+WordToHex(c)+WordToHex(d);
      return temp.toLowerCase();
    }

    // Hex MD5 string to Base64 encoder helper
    function getMd5Base64(string) {
      const hex = md5(string);
      const bytes = new Uint8Array(hex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
      let binString = "";
      for (let i = 0; i < bytes.length; i++) {
        binString += String.fromCharCode(bytes[i]);
      }
      return btoa(binString);
    }

    // UI elements
    const btnConnect = document.getElementById('btn-connect');
    const statusText = document.getElementById('status-text');
    const statusDot = document.getElementById('status-dot');
    const logPanel = document.getElementById('log-panel');
    const passcodeField = document.getElementById('device-passcode');
    const pinField = document.getElementById('device-pin');
    const serialField = document.getElementById('device-serial');

    const controlButtons = [
      document.getElementById('btn-open'),
      document.getElementById('btn-close'),
      document.getElementById('btn-ped'),
      document.getElementById('btn-light'),
      document.getElementById('btn-stop')
    ];

    // GATT UUID configurations
    const UUID_SERVICE_CUSTOM = '0000a001-0000-1000-8000-00805f9b34fb';
    const UUID_SERVICE_VENDOR = 'd9403fbf-2e16-4d48-8a8a-3478b41daccc';
    const UUID_CHAR_B001      = '0000b001-0000-1000-8000-00805f9b34fb';
    const UUID_CHAR_C000      = '0000c000-0000-1000-8000-00805f9b34fb';
    const UUID_CHAR_C001      = '0000c001-0000-1000-8000-00805f9b34fb';
    const UUID_CHAR_C004      = '0000c004-0000-1000-8000-00805f9b34fb';

    let gattServer = null;
    let bleDevice = null;
    let charAuth = null;
    let charControl = null;
    let charStatus = null;
    let charDebug = null;
    let isLightOn = false;

    // Load credentials from LocalStorage
    document.addEventListener('DOMContentLoaded', () => {
      passcodeField.value = localStorage.getItem('gate_passcode') || '';
      pinField.value = localStorage.getItem('gate_pin') || '';
      serialField.value = localStorage.getItem('gate_serial') || '9999999';
    });

    // Logging utility
    function log(message, type = '') {
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.innerText = `[${new Date().toLocaleTimeString()}] ${message}`;
      logPanel.appendChild(entry);
      logPanel.scrollTop = logPanel.scrollHeight;
    }

    // Set connection status UI
    function setStatus(status) {
      if (status === 'disconnected') {
        statusText.innerHTML = '<div id="status-dot" class="status-dot"></div>Disconnected';
        statusDot.className = 'status-dot';
        btnConnect.querySelector('span').innerText = 'Connect';
        btnConnect.disabled = false;
        controlButtons.forEach(btn => btn.disabled = true);
      } else if (status === 'connecting') {
        statusText.innerHTML = '<div id="status-dot" class="status-dot connecting"></div>Connecting...';
        btnConnect.querySelector('span').innerText = 'Wait...';
        btnConnect.disabled = true;
      } else if (status === 'connected') {
        statusText.innerHTML = '<div id="status-dot" class="status-dot connected"></div>Connected';
        btnConnect.querySelector('span').innerText = 'Disconnect';
        btnConnect.disabled = false;
        controlButtons.forEach(btn => btn.disabled = false);
      }
    }

    // Parse semicolon separated response parameters (e.g. M=1;C=nonce)
    function parseParameters(string) {
      const params = {};
      const pairs = string.split(';');
      for (const pair of pairs) {
        const parts = pair.split('=');
        if (parts.length === 2) {
          params[parts[0].trim()] = parts[1].trim();
        }
      }
      return params;
    }

    async function dumpGattProfile(server) {
      log('Running GATT profile diagnostics...', 'info');
      try {
        const services = await server.getPrimaryServices();
        log(`Discovered ${services.length} services:`, 'info');
        for (const service of services) {
          log(`Service: ${service.uuid}`, 'info');
          try {
            const characteristics = await service.getCharacteristics();
            log(`  Characteristics count: ${characteristics.length}`, 'info');
            for (const char of characteristics) {
              const props = [];
              if (char.properties.read) props.push('read');
              if (char.properties.write) props.push('write');
              if (char.properties.writeWithoutResponse) props.push('writeWithoutResponse');
              if (char.properties.notify) props.push('notify');
              if (char.properties.indicate) props.push('indicate');
              log(`  - Char: ${char.uuid} [${props.join(', ')}]`, 'info');
            }
          } catch (charErr) {
            log(`  Failed to discover characteristics: ${charErr.message}`, 'error');
          }
        }
      } catch (err) {
        log(`GATT discovery failed: ${err.message}`, 'error');
      }
    }

    // Helper to find characteristic in primary service, falling back to service traversal if service UUID differs
    async function getCharacteristicRobust(server, serviceUuid, charUuid) {
      try {
        const service = await server.getPrimaryService(serviceUuid);
        return await service.getCharacteristic(charUuid);
      } catch (e) {
        log(`Primary service query failed: ${serviceUuid}. Scanning services...`, 'info');
        const services = await server.getPrimaryServices();
        for (const service of services) {
          try {
            const char = await service.getCharacteristic(charUuid);
            if (char) return char;
          } catch (innerErr) {}
        }
        throw new Error(`Characteristic ${charUuid} not found in GATT profile.`);
      }
    }

    // Trigger Connection Flow
    async function handleConnection() {
      if (gattServer && gattServer.connected) {
        log('Disconnecting from gate...', 'info');
        gattServer.disconnect();
        return;
      }

      // Check fields
      const passcode = passcodeField.value.trim();
      const pin = pinField.value.trim();
      const serial = serialField.value.trim();

      if (!pin) {
        log('Error: Security PIN must be filled!', 'error');
        alert('Please fill out the Security PIN field.');
        return;
      }

      // Save credentials locally
      localStorage.setItem('gate_passcode', passcode);
      localStorage.setItem('gate_pin', pin);
      localStorage.setItem('gate_serial', serial);

      setStatus('connecting');
      log('Requesting Bluetooth device matching "WBT01-"...', 'info');

      try {
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [
            { namePrefix: 'WBT01-' }
          ],
          optionalServices: [
            UUID_SERVICE_CUSTOM,
            UUID_SERVICE_VENDOR,
            '00001800-0000-1000-8000-00805f9b34fb', // Generic Access
            '00001801-0000-1000-8000-00805f9b34fb', // Generic Attribute
            '0000180a-0000-1000-8000-00805f9b34fb'  // Device Info
          ]
        });

        log(`Found device: ${bleDevice.name}. Connecting to GATT server...`, 'info');
        
        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
        gattServer = await bleDevice.gatt.connect();
        
        // Run diagnostic dump of services and characteristics
        await dumpGattProfile(gattServer);
        
        log('Connected to GATT. Locating Auth Characteristic...', 'info');
        charAuth = await getCharacteristicRobust(gattServer, UUID_SERVICE_CUSTOM, UUID_CHAR_B001);
        
        log('Connected! Locating Control Characteristic...', 'info');
        charControl = await getCharacteristicRobust(gattServer, UUID_SERVICE_CUSTOM, UUID_CHAR_C000);

        log('Handshake: Reading challenge token from gate...', 'info');
        const challengeRaw = await charAuth.readValue();
        const challengeStr = new TextDecoder('utf-8').decode(challengeRaw);
        
        log(`Challenge received: "${challengeStr}"`, 'info');
        const params = parseParameters(challengeStr);

        if (!params.C) {
          throw new Error('Challenge nonce "C" was not found in response.');
        }

        // Key calculation: Base64(MD5(PasscodePrefix + PIN + NonceC))
        let passcodePrefix = passcode.trim();
        
        // 1. Fallback to connected device name if passcode is not set
        if (!passcodePrefix) {
          passcodePrefix = bleDevice.name || "";
          log(`No passcode provided. Derived passcode prefix from connection: "${passcodePrefix}"`, 'info');
        }
        
        // 2. If passcode is a UUID, extract MAC and device name prefix
        if (passcodePrefix.length === 36 && (passcodePrefix.match(/-/g) || []).length === 4) {
          const parts = passcodePrefix.split('-');
          if (parts.length >= 2 && parts[0].length === 8 && parts[1].length === 4) {
            const rawMac = (parts[0] + parts[1]).toUpperCase();
            const suffix = rawMac.substring(rawMac.length - 4);
            passcodePrefix = `WBT01-${suffix}`;
            log(`Passcode is UUID. Derived device name prefix: "${passcodePrefix}"`, 'info');
          }
        }
        
        // 3. Apply the original length and "wbt" content filter
        if (passcodePrefix.length > 10 && passcodePrefix.toLowerCase().includes('wbt')) {
          passcodePrefix = passcodePrefix.substring(0, 10);
        }

        const authStringRaw = passcodePrefix + pin + params.C;
        log(`Handshake Debug: passcode="${passcode}", resolvedPrefix="${passcodePrefix}", pin="${pin}", challenge="${params.C}", concatenated="${authStringRaw}"`, 'info');
        const base64Hash = getMd5Base64(authStringRaw);
        const finalKey = base64Hash.substring(0, 16);

        // Replace Base64 URL characters
        const finalKeyEncoded = finalKey.replace(/\+/g, '%2B').replace(/\//g, '%2F');

        // Write challenge response: M=[M];K=[Key]
        const responsePayload = `M=${params.M || '0'};K=${finalKeyEncoded}`;
        log(`Handshake: Writing verification response: "${responsePayload}"`, 'info');
        
        const encoder = new TextEncoder();
        if (charAuth.writeValueWithResponse) {
          await charAuth.writeValueWithResponse(encoder.encode(responsePayload));
        } else {
          await charAuth.writeValue(encoder.encode(responsePayload));
        }

        log('Locating Status & Debug Characteristics...', 'info');
        try {
          charStatus = await getCharacteristicRobust(gattServer, UUID_SERVICE_CUSTOM, UUID_CHAR_C001);
          charStatus.addEventListener('characteristicvaluechanged', handleStatusNotification);
          await charStatus.startNotifications();
          log('Subscribed to Status updates.', 'success');
        } catch (e) {
          log(`Failed to subscribe to Status characteristic: ${e.message}`, 'error');
        }

        try {
          charDebug = await getCharacteristicRobust(gattServer, UUID_SERVICE_CUSTOM, UUID_CHAR_C004);
          charDebug.addEventListener('characteristicvaluechanged', handleDebugNotification);
          await charDebug.startNotifications();
          log('Subscribed to Debug logs.', 'success');
        } catch (e) {
          log(`Failed to subscribe to Debug characteristic: ${e.message}`, 'error');
        }

        log('Authentication handshake complete! Gate unlocked.', 'success');
        setStatus('connected');

      } catch (err) {
        log(`Connection failed: ${err.message}`, 'error');
        if (err.message.includes('No Services found')) {
          log('Troubleshooting: If services were not found, try: (1) Turn Bluetooth OFF and back ON in your PC settings. (2) Unpair/forget the WBT01 device from your OS Bluetooth paired devices list, then restart Chrome. (3) On Linux, run: sudo systemctl restart bluetooth', 'info');
        }
        console.error(err);
        setStatus('disconnected');
        if (gattServer) gattServer.disconnect();
      }
    }

    function handleStatusNotification(event) {
      try {
        const value = event.target.value;
        const text = new TextDecoder('utf-8').decode(value);
        log(`[STATUS NOTIFY] Received: "${text}"`, 'success');
      } catch (err) {
        log(`Status notification error: ${err.message}`, 'error');
      }
    }

    function handleDebugNotification(event) {
      try {
        const value = event.target.value;
        const text = new TextDecoder('utf-8').decode(value);
        log(`[DEBUG NOTIFY] Received: "${text}"`, 'info');
      } catch (err) {
        log(`Debug notification error: ${err.message}`, 'error');
      }
    }

    function onDisconnected() {
      log('Bluetooth connection disconnected.', 'error');
      setStatus('disconnected');
      gattServer = null;
      charAuth = null;
      charControl = null;
      if (charStatus) {
        charStatus.removeEventListener('characteristicvaluechanged', handleStatusNotification);
        charStatus = null;
      }
      if (charDebug) {
        charDebug.removeEventListener('characteristicvaluechanged', handleDebugNotification);
        charDebug = null;
      }
    }

    // Send control commands to gate
    async function sendCommand(command) {
      if (!charControl) {
        log('Error: Not connected to gate!', 'error');
        return;
      }

      const serial = serialField.value.trim() || '9999999';
      const rawCommand = `${command};src=P${serial}\r\n`;
      const payloadObj = {
        VER: 1,
        CMD: 'UART',
        ACT: 'POST',
        DATA: {
          PKCMD: rawCommand
        }
      };
      const payload = JSON.stringify(payloadObj);

      log(`Sending command: "${command}" (Payload: ${payload})`, 'info');
      try {
        const encoder = new TextEncoder();
        if (charControl.writeValueWithResponse) {
          await charControl.writeValueWithResponse(encoder.encode(payload));
        } else {
          await charControl.writeValue(encoder.encode(payload));
        }
        log(`Command "${command}" sent successfully!`, 'success');
      } catch (err) {
        log(`Failed to write command: ${err.message}`, 'error');
      }
    }

    // Setup action button events
    btnConnect.addEventListener('click', handleConnection);

    document.getElementById('btn-open').addEventListener('click', () => sendCommand('FULL OPEN'));
    document.getElementById('btn-close').addEventListener('click', () => sendCommand('FULL CLOSE'));
    document.getElementById('btn-ped').addEventListener('click', () => sendCommand('PED OPEN'));
    document.getElementById('btn-stop').addEventListener('click', () => sendCommand('STOP'));

    document.getElementById('btn-light').addEventListener('click', () => {
      isLightOn = !isLightOn;
      const cmd = isLightOn ? 'LIGHT ON' : 'LIGHT OFF';
      sendCommand(cmd);
      document.getElementById('btn-light').querySelector('span').innerText = isLightOn ? 'LIGHT OFF' : 'LIGHT ON';
    });

    document.getElementById('btn-copy-logs').addEventListener('click', () => {
      const logsText = Array.from(logPanel.querySelectorAll('.log-entry'))
        .map(entry => entry.innerText)
        .join('\n');
      navigator.clipboard.writeText(logsText).then(() => {
        const btn = document.getElementById('btn-copy-logs');
        const span = btn.querySelector('span');
        const origText = span.innerText;
        span.innerText = 'Copied!';
        setTimeout(() => { span.innerText = origText; }, 1500);
      }).catch(err => {
        alert('Failed to copy: ' + err);
      });
    });

  </script>
</body>
</html>
